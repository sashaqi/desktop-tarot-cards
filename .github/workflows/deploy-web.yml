name: Deploy web build

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one deployment at a time; let an in-flight run finish rather than
# cancelling it, so a half-published site is never left live.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Build
        # GitHub Pages serves a project site from /<repo>/, so assets need that prefix.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build:web

      - name: Bypass Jekyll
        run: touch dist-web/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
